statechart:
  name: ExplorerFileOpenStrategyChain
  description: >-
    Chain of responsible opening strategies run by FILE_OPENING_STRATEGY_FOUND.
    Every capability that implements `canHandle` — in the core transformation
    folder or in an addon — is one region of the parallel root: the region asks
    `can_handle` and, when it holds, runs `execute_responsibility`. The topology
    is the same for every responsibility and is built by the worker from the
    capabilities; this file only names the chain.
