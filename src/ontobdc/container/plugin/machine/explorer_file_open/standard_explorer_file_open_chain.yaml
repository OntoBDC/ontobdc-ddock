statechart:
  name: ExplorerFileOpenStrategyChain
  description: >-
    Fallback chain run by FILE_OPENING_STRATEGY_FOUND when no capability is
    registered for the file's extension. The complete topology is declared
    here: the root is parallel and each region is one responsibility, named
    by the id of the capability it runs. The worker only interprets this
    file; it never adds, removes or renames states or regions.

    A responsibility is declared as one region of this shape:

      - name: <responsibility>
        initial: <responsibility>_pending
        states:
          - name: <responsibility>_pending
            transitions:
              - target: <responsibility>_completed
                guard: worker.can_handle('<capability id>')
                action: worker.execute_responsibility('<capability id>')
              - target: <responsibility>_completed
                guard: not worker.can_handle('<capability id>')
          - name: <responsibility>_completed
            type: final

  root state:
    name: explorer_file_open_strategy_chain
    parallel states:
      - name: image
        initial: image_pending
        states:
          - name: image_pending
            transitions:
              - target: image_completed
                guard: worker.can_handle('org.ontobdc.container.plugin.capability.transformation.strategy.image_tab_opened')
                action: worker.execute_responsibility('org.ontobdc.container.plugin.capability.transformation.strategy.image_tab_opened')
              - target: image_completed
                guard: not worker.can_handle('org.ontobdc.container.plugin.capability.transformation.strategy.image_tab_opened')
          - name: image_completed
            type: final
      - name: pdf
        initial: pdf_pending
        states:
          - name: pdf_pending
            transitions:
              - target: pdf_completed
                guard: worker.can_handle('org.ontobdc.container.plugin.capability.transformation.strategy.pdf_tab_opened')
                action: worker.execute_responsibility('org.ontobdc.container.plugin.capability.transformation.strategy.pdf_tab_opened')
              - target: pdf_completed
                guard: not worker.can_handle('org.ontobdc.container.plugin.capability.transformation.strategy.pdf_tab_opened')
          - name: pdf_completed
            type: final
      - name: txt
