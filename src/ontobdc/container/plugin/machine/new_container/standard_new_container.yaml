statechart:
  name: StandardNewContainer
  description: "Statechart for creating a new databim.tech container from the browser."

  root state:
    name: standard_new_container
    initial: undefined

    states:
      - name: undefined
        label:
          en: "Undefined"
          pt-br: "Indefinido"
        description:
          en: "Initial state before anything was prepared."
          pt-br: "Estado inicial antes de qualquer preparação."
        transitions:
          - target: storage_root_defined
            guard: handler.can_transit_to(to_state = NewContainerStatePort.STORAGE_ROOT_DEFINED)
            action: handler.perform_state_transition(to_state = NewContainerStatePort.STORAGE_ROOT_DEFINED)

      - name: storage_root_defined
        label:
          en: "Storage Root Defined"
          pt-br: "Raiz do Armazenamento Definida"
        description:
          en: "The folder that is the root of the workspace was picked, and is the candidate the next states work on."
          pt-br: "A pasta que é a raiz do espaço de trabalho foi escolhida e é a candidata em que os próximos estados trabalham."
        transitions:
          - target: workspace_container_created
            guard: handler.can_transit_to(to_state = NewContainerStatePort.WORKSPACE_CONTAINER_CREATED)
            action: handler.perform_state_transition(to_state = NewContainerStatePort.WORKSPACE_CONTAINER_CREATED)

      - name: workspace_container_created
        label:
          en: "Workspace Container Created"
          pt-br: "Contêiner do Espaço de Trabalho Criado"
        description:
          en: "The folder of the container is in the listing of the workspace."
          pt-br: "A pasta do contêiner está na listagem do espaço de trabalho."
        transitions:
          - target: workspace_container_healthy
            guard: handler.can_transit_to(to_state = NewContainerStatePort.WORKSPACE_CONTAINER_HEALTHY)
            action: handler.perform_state_transition(to_state = NewContainerStatePort.WORKSPACE_CONTAINER_HEALTHY)

      - name: workspace_container_healthy
        label:
          en: "Workspace Container Healthy"
          pt-br: "Contêiner do Espaço de Trabalho Saudável"
        description:
          en: "The container was refreshed to match the files it holds."
          pt-br: "O contêiner foi atualizado para refletir os arquivos que contém."
        type: final
