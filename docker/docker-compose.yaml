services:
  obdc-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: obdc-gateway
    working_dir: /app
    volumes:
      - ../src:/app
      - ../storage:/storage
      - ../log:/log
      - ../../wip/src/ontobdc:/usr/local/lib/python3.12/site-packages/ontobdc:ro
    ports:
      - "8000:8000"
